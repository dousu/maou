[workspace]
members = [
    "rust/maou_io",
    "rust/maou_rust",
    "rust/maou_index",
    "rust/maou_shogi",
    "rust/maou_search",
    "rust/maou_convert",
    "rust/maou_usi",
]
resolver = "2"

[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
polars = { version = "0.53", features = [
    "lazy",
    "ipc",
    "ipc_streaming",  # Arrow IPC Stream 形式の .feather を読むために必要
    "parquet",  # Required by polars-stream 0.53 when ipc is enabled
    # Only include optional dtypes actually used (analyzed from schema.py and index.rs)
    # This replaces dtype-full which compiles 18+ optional dtypes
    # Note: Core types (i32, i64, u32, u64, f32, f64) are always available
    "dtype-i8",    # Used in HCPE and preprocessing schemas
    "dtype-i16",   # Used in HCPE and preprocessing schemas
    "dtype-u8",    # Used in board representations
    "dtype-u16",   # Used in move labels and indexing
    "dtype-date",  # Used for timestamp fields
    # u64 is a core type, no feature flag needed
] }
arrow = { version = "58.0", features = ["ipc", "ipc_compression"] }
arrow-pyarrow = { version = "58.0" }
numpy = { version = "0.28" }
thiserror = "2.0"
rustc-hash = "2.1"
arrayvec = "0.7"
tempfile = "3.26"
rayon = "1.10"
encoding_rs = "0.8"

# Build profile optimizations for memory-constrained environments
[profile.dev]
opt-level = 0
codegen-units = 16  # Parallel codegen to reduce peak memory (required for 4GB RAM environments)
incremental = false  # Disabled for sccache compatibility
# Reduce debuginfo to save disk space and build time
debug = 1  # Line tables only

# twox-hash 2.1.2 has a bug: xxhash32.rs:298 uses `acc += len as u32`
# instead of `acc = acc.wrapping_add(len as u32)`.
# xxHash32 algorithm relies on wrapping arithmetic by design,
# but this line panics in debug builds due to Rust's overflow checks.
# Disable overflow checks for this crate only.
# Ref: https://github.com/shepmaster/twox-hash (upstream bug)
[profile.dev.package.twox-hash]
overflow-checks = false

[profile.release]
opt-level = 3
codegen-units = 1  # Sequential even for release (memory over speed)
lto = "thin"  # Thin link-time optimization
incremental = true
# Strip debuginfo for smaller binaries (maturin handles this)
strip = "debuginfo"

# Balanced profile for production builds with memory constraints
[profile.mem-opt]
inherits = "release"
opt-level = 2  # Moderate optimization
codegen-units = 1
lto = "thin"

# Python 拡張の既定プロファイル (`[tool.maturin] profile`).
#
# 目的は **明示ビルドと暗黙ビルドのプロファイルを一致させること**．
# 以前は maturin 既定が dev だったため，`uv run maturin develop --release`
# で入れた release 拡張が，その後の任意の `uv run` による暗黙リビルドで
# debug 拡張に黙って差し替えられていた．同種の暗黙上書きは onnx feature
# でも一度踏んでいる (pyproject.toml の [tool.maturin] コメント参照)．
#
# release をそのまま使わない理由:
# - `lto = "thin"` はコールドビルド時間の主要因で，出荷 wheel 向けの
#   最適化．Python テストを現実的な速度で回す目的には不要．
# - release は `debug-assertions` / `overflow-checks` を落とす．
#   `rust/maou_rust` (PyO3 バインディング) には `#[test]` が存在せず，
#   Python 経由でしか実行されないため，ここを落とすと FFI 境界の
#   overflow 検査カバレッジが**無くなる** (代替が無い)．
#   dev で twox-hash だけ overflow-checks を切っている事実
#   (上の [profile.dev.package.twox-hash]) が，検査が現に効いていた証拠．
#
# `codegen-units = 1` は release から継承する．上げればビルドは速くなるが
# ピーク RSS が増え，8GB DevContainer で dfpn テストが OOM → SIGTERM に
# なった履歴があるため据え置く．
[profile.py-ext]
inherits = "release"
opt-level = 3
lto = false  # コールドビルド時間の主要因を落とす
debug-assertions = true  # Python 経由が maou_rust の唯一の実行経路
overflow-checks = true  # 同上. FFI 境界の index/長さ計算を守る
