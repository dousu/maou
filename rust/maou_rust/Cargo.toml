[package]
name = "maou_rust"
version = "0.46.0"
edition = "2021"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[features]
# maou_search の ONNX 評価器を有効化する．**pyproject.toml の
# [tool.maturin] features が既定で onnx を含む** ので，maturin 経由のビルド
# (uv sync / uv run の暗黙リビルドを含む) は常に ONNX 付きになる．
# ONNX は CPU 実行のみを既定とし可搬性は保たれる — 可搬性を壊すのは HW 依存の
# cuda/tensorrt 側で，そちらは既定に入れず実行時 opt-in のままにする．
# cuda/tensorrt は自 crate の onnx を含意する (バインディングの cfg は
# maou_rust 自身の feature を見るため)
onnx = ["maou_search/onnx", "maou_usi/onnx"]
onnx-cuda = ["onnx", "maou_search/onnx-cuda", "maou_usi/onnx-cuda"]
onnx-tensorrt = ["onnx", "maou_search/onnx-tensorrt", "maou_usi/onnx-tensorrt"]

[dependencies]
pyo3 = { workspace = true }
arrow = { workspace = true }
arrow-pyarrow = { workspace = true }
numpy = { workspace = true }
maou_io = { path = "../maou_io" }
maou_index = { path = "../maou_index" }
maou_shogi = { path = "../maou_shogi" }
maou_search = { path = "../maou_search" }
maou_convert = { path = "../maou_convert" }
maou_usi = { path = "../maou_usi" }

[dev-dependencies]
tempfile = { workspace = true }
