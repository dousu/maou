[project]
name = "maou"
version = "0.92.3"
description = "Shogi AI"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.1.7",
    "tqdm>=4.67.1",
    "numpy>=1.19.0",
    "google-crc32c>=1.6.0",
    "psutil>=6.0.0",
    "polars>=1.0.0",
    "duckdb (>=1.4.3,<2.0.0)",
    "plotly>=6.5.0,<7.0.0",
]

[project.optional-dependencies]
# GPU種類ごとのextra
cpu = [
    "torch>=2.6.0,<=2.11.0",
    "torchinfo>=1.8.0",
    "torch-tb-profiler>=0.4.3",
    "onnxruntime",
    "onnxruntime-tools",
    "onnxslim",
]
cuda = [
    "torch>=2.6.0,<=2.11.0",
    "torchinfo>=1.8.0",
    "torch-tb-profiler>=0.4.3",
    "nvidia-ml-py>=11.4.1",
    "onnxruntime-gpu",
    "onnxruntime-tools",
    "onnxslim",
]
mpu = [
    "torch>=2.6.0,<=2.11.0",
    "torchinfo>=1.8.0",
    "torch-tb-profiler>=0.4.3",
    "onnxruntime-gpu",
    "onnxruntime-tools",
    "onnxslim",
]
cpu-infer = [
    "onnxruntime",
]
# GPU 推論 extra の版固定 (重要):
#   Rust wheel (maou_search) は ort crate 経由で onnxruntime 1.22 系を静的
#   リンクする．maou search の GPU 実行時に dlopen される provider .so
#   (libonnxruntime_providers_{shared,cuda,tensorrt}.so) は onnxruntime-gpu
#   pip パッケージの capi/ から供給できるが，**静的コアと同一版でないと
#   ABI 不一致でロードに失敗する**ため onnxruntime-gpu==1.22.* に固定する．
#   これにより配布 wheel (latest) + `maou[tensorrt-infer]` だけで provider が揃い，
#   provider tarball の別途 wget が不要になる (Colab 手順を簡素化)．
#   TensorRT ランタイム (libnvinfer.so.10) は onnxruntime 1.22 が要求する
#   10 系に固定する (pin なしだと 11 系が入り解決不能)．
onnx-gpu-infer = [
    "onnxruntime-gpu==1.22.*",
]
tensorrt-infer = [
    "onnxruntime-gpu==1.22.*",
    "tensorrt-cu12==10.*",
    "tensorrt-lean-cu12==10.*",
    "tensorrt-dispatch-cu12==10.*",
]
# クラウドプロバイダーごとのextra
gcp = [
    "google-cloud-storage>=2.19.0",
    "google-cloud-bigquery[pandas]>=3.27.0",
    "google-cloud-bigquery-storage>=2.28.0",
]
aws = [
    "boto3>=1.34.0",
]
# 可視化ツール用のextra
visualize = [
    "gradio>=6.7.0,<7.0.0",
    "matplotlib>=3.5.0",
]
# floodgate 棋譜取得 (fetch-floodgate) の年次 .7z アーカイブ展開用 extra．
# daily 戦略と .tar.xz 年 (2011/2012) は標準ライブラリのみで動作する
fetch = [
    "py7zr>=0.21.0",
]

[project.scripts]
maou = "maou.infra.console.app:main"
# USI エンジンの引数なしエントリポイント (起動引数を渡せない GUI 向け)
maou-usi = "maou.infra.console.usi:main"

[tool.uv]
package = true
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "mpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-cuda", extra = "mpu" },
]
serena-agent = { git = "https://github.com/oraios/serena" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.maturin]
python-source = "src"
module-name = "maou._rust"
manifest-path = "rust/maou_rust/Cargo.toml"
binding = "pyo3"
# onnx を既定に含める: これを外すと ModelPath が使えない拡張ができあがり，
# `uv sync` / `uv run` の暗黙リビルドが明示ビルドを黙って上書きして
# 「this build has no onnx feature」で実行時に落ちる (2026-07-29 に踏んだ)．
# cuda/tensorrt は HW 依存なので既定に入れない (実行時 opt-in のまま)．
features = ["pyo3/extension-module", "onnx"]
# py-ext は release 継承 + LTO 無効 + debug-assertions/overflow-checks 有効
# (定義と理由は root Cargo.toml)．ここを dev に戻すと，明示ビルドと
# `uv run` の暗黙リビルドでプロファイルが食い違い，最適化拡張が黙って
# debug 拡張に差し替えられる状態に戻る．
profile = "py-ext"

[dependency-groups]
dev = [
    # cshogi は棋譜パーサの parity 検証 oracle (golden fixture 再生成
    # scratchpad/gen_kifu_golden.py と交差検証テスト) のため dev に残す．
    "cshogi>=0.9.2",
    "pre-commit>=4.3.0",
    "yamllint>=1.37.1",
    "commitizen>=4.9.1",
    "pytest>=8.4.2",
    # ruff はここが唯一の版指定 (pre-commit は local hook で
    # `uv run ruff` を呼ぶ)．select を明示していないため
    # **適用ルール集合 = ruff の版**であり，版を上げると検出結果が変わる．
    # 範囲指定にすると `uv lock --upgrade` で暗黙に変わるため == で固定する．
    # 上げるときは docs/code-quality.md の差分検証手順に従うこと．
    "ruff==0.16.1",
    "types-tqdm>=4.67.0.20250809",
    "mypy>=1.18.2",
    "google-cloud-storage>=3.4.1",
    "google-cloud-bigquery[pandas]>=3.38.0",
    "google-cloud-bigquery-storage>=2.33.1",
    "boto3>=1.40.54",
    "autopep8>=2.3.2",
    "yapf>=0.43.0",
    "netron>=8.6.8",
    "maturin[patchelf]>=1.7.0",
    "playwright>=1.40.0",
    "pytest-cov>=4.0.0",
    "serena-agent",
    "matplotlib",
    "japanize-matplotlib>=1.1.3",
    "scipy>=1.17.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]
filterwarnings = [
    # #1: DataLoader worker数超過 (DevContainer CPU制約)
    "ignore::UserWarning:torch.utils.data.dataloader",
    # #2: Polars cast時のNaN→int変換 (テストデータのNULLフィールド)
    "ignore:invalid value encountered in cast:RuntimeWarning",
    # #3: ONNX export API非推奨 (PyTorch外部依存)
    "ignore::DeprecationWarning:torch.onnx",
    # #5: fork() in multithreaded context (spawn移行後の残留警告対策)
    "ignore::DeprecationWarning:multiprocessing.popen_fork",
    # #6: pin_memory on CPU-only (テスト環境制約)
    "ignore:.*pin_memory.*:UserWarning",
    # #7: torch.jit.is_tracing() deprecated in PyTorch 2.9+ (TorchScript sunset)
    "ignore::DeprecationWarning:torch.jit",
]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["./typings"]

[[tool.mypy.overrides]]
module = [
  "click",
  "cshogi",
  "pytest",
  "torchinfo",
  "google_crc32c",
  "google.cloud",
  "torch.onnx",
  "maou.*",
]

[tool.ruff]
line-length = 64
indent-width = 4

[tool.ruff.lint]
# 適用ルールは ruff のデフォルト集合に追随する (2026-08-04 時点で 413 ルール)．
#
# select を明示していない理由:
#   ruff のデフォルトはファミリ全体ではなく厳選されたサブセットである
#   (例: E は E722/E902 のみで E501 を含まない，D は D419 のみ，
#    N は N999 のみ，S は S102/S110/S112 のみ)．
#   そのため select にファミリ接頭辞を並べても再現できず，実測では
#   413 に対し 586 ルールと大幅に超過した (PLR0913 / PLR2004 / PTH1xx /
#   PT0xx / G004 等が余分に入る)．413 コードの列挙は現実的でない．
#
# 版上げ時の必須手順:
#   ruff を上げるとデフォルト集合が変わりうる (0.15 -> 0.16 では
#   同一コードに 484 件が新規検出された)．hook 引数が --fix のため，
#   放置すると未レビューの一括自動書き換えが走る．
#   MUST 上げる前に新旧の有効ルールを比較し，増分を意図的に採否すること:
#     uv tool run ruff@<新版> check --show-settings --isolated \
#       | sed -n '/linter.rules.enabled/,/^]/p' | grep -oE '\([A-Z]+[0-9]+\)'
#   詳細は docs/code-quality.md を参照．
#
# import 順は ruff (I) が担当する．isort は 2026-08-04 に廃止した
# (両者は 19-22 ファイルで整形が食い違い，同時有効化すると
#  互いに書き換え合うため)．
ignore = [
    # BLE001 (blind-except): 本リポジトリでは `except Exception` は
    # 境界での意図的な graceful degradation として使っている
    # (バッチ処理のファイル単位スキップ，ワーカースレッドの例外収集，
    #  描画失敗時のフォールバック，任意クラウド依存の機能縮退など)．
    # 例外型を絞ると polars / GCS / PyO3 が投げる想定外の型を取り逃し，
    # 「1 ファイルをスキップする」はずが「バッチ全体が落ちる」に化ける．
    # 57 箇所すべてがこの用途だったため個別 noqa ではなく一括で無効化する
    # (2026-08-04 に全件確認．33 ファイルに分布しており per-file-ignores
    #  では冗長すぎるため blanket にした)．
    # 注意: これは「今後書かれる except Exception」も無条件で通す．
    # 依存追加やレイヤ追加でこの前提が変わったら再監査すること．
    "BLE001",
    # ISC004: line-length = 64 という短い設定のため，長いログ行や
    # メッセージはリスト要素内で f-string を複数行に分けて組み立てざるを
    # 得ない．このルールは「リスト内のカンマ抜け」を疑うものだが，
    # 該当 10 箇所はすべて意図的な折り返しだった (2026-08-04 に全件確認)．
    "ISC004",
]

[tool.ruff.lint.per-file-ignores]
# 明示的再エクスポート facade (PEP 484 の `from X import name as name` 記法)．
# PLC0414 は alias を「無意味」とみなすが，除去すると再エクスポートの意図が
# 失われ，型チェッカから見た公開 API が変わる．記法は意図的なので抑止する．
"src/maou/infra/console/common.py" = ["PLC0414"]
"src/maou/interface/analysis_gui.py" = ["PLC0414"]
"src/maou/interface/data_io.py" = ["PLC0414"]
"src/maou/interface/data_schema.py" = ["PLC0414"]
"src/maou/interface/learn.py" = ["PLC0414"]
"src/maou/interface/visualization.py" = ["PLC0414"]

[tool.ruff.lint.isort]
known-first-party = ["maou"]
