name: Build Windows Wheel

# Windows x86_64 の CPU 専用 wheel を Actions artifact として出す．
# GUI 実機検証 (docs/design/usi-engine/verification.md §8) 用の手段であり，
# Release latest の配布方針 (単一 manylinux wheel —
# reviews/2026-07-16-unified-wheel-build.md) には手を付けない．
#
# cargo features は onnx のみ (cuda/tensorrt は付けない):
# Windows 機は CPU 動作の検証にしか使わず，CUDA/TensorRT の SDK を runner に
# 用意する必要も無いため．ONNX Runtime のコアは ort が静的リンクする．
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-wheel-windows.yml

concurrency:
  group: build-wheel-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1.50.1
        with:
          target: x86_64-pc-windows-msvc
          sccache: "true"
          # 既定の profile は dev (pyproject.toml [tool.maturin]) なので
          # --release を明示する．--features の onnx を落とすと pure Rust
          # ビルドになり ModelPath が使えない (backend.rs の feature gate)
          args: --release --out dist -i python --features pyo3/extension-module,onnx

      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $whl = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install "$whl"

      - name: USI headless smoke (mock evaluator)
        shell: pwsh
        run: python scripts/usi_smoke.py --timeout 180

      - uses: actions/upload-artifact@v4
        with:
          name: maou-windows-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
