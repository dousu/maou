# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-added-large-files
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.1
  hooks:
  - id: uv-lock
- repo: https://github.com/pre-commit/pre-commit
  rev: v4.6.1
  hooks:
  - id: validate_manifest
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.17.0
  hooks:
  - id: commitizen
- repo: local
  hooks:
  - id: test
    name: test
    entry: uv run pytest -v -s
    stages:
    - "pre-commit"
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: uv run mypy
    language: system
    types: [python]
    pass_filenames: false
    always_run: false
    args: ["src/", "tests/"]
- repo: local
  hooks:
  - id: check-cli-docs
    name: check-cli-docs
    entry: bash scripts/check-cli-docs.sh
    stages:
    - "pre-commit"
    language: system
    pass_filenames: false
    always_run: true
# ruff は uv 管理の 1 本だけを使う (local hook)．
# ruff-pre-commit を使うと hook 側が独自に ruff を入れるため，
# pyproject.toml の dev 依存と 2 版が共存する．
# select を明示していない本リポジトリでは
# **適用ルール集合 = ruff の版**なので，版がずれると
# `uv run ruff check` と pre-commit で結果が食い違う
# (2026-08-04: hook 0.16.1 / dev 0.15.2 のズレで，0.16.1 基準で剥がした
#  E402 抑止が 0.15.2 側で 9 件のエラーとして再燃した)．
# local hook には rev が無いため `pre-commit autoupdate` の対象外になり，
# ruff の版上げは pyproject.toml の編集としてのみ起きる (差分が見える)．
# rustfmt も ruff と同じ理由で local hook にする．
# hook 側が独自に Rust toolchain を入れると rust-toolchain の版と
# 二重化し，ローカルの `cargo fmt` と pre-commit の結果が食い違う．
# local hook には rev が無いので `pre-commit autoupdate` の対象外になり，
# 版上げは toolchain の更新としてのみ起きる．
# `--check` ではなく自動整形にするのは Python 側の ruff-format に揃えるため
# (未整形を残すと，無関係な PR に整形差分が混ざる)．
# `cargo fmt` はファイル引数ではなく crate 単位で動くので
# pass_filenames: false が必須．
- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo-fmt
    entry: cargo fmt --all
    language: system
    types_or: [rust]
    pass_filenames: false
    require_serial: true
- repo: local
  hooks:
  - id: ruff-check
    name: ruff-check
    entry: uv run ruff check --fix --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: ruff-format
    name: ruff-format
    entry: uv run ruff format --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
